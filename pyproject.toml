[tool.pytest.ini_options]
testpaths = ["backend/tests", "ml_pipeline/tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
select = ["E", "F", "B", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
exclude_dirs = ["tests", "*/tests/*"]
targets = ["backend", "ml_pipeline"]
